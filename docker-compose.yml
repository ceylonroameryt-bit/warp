version: "3.9"

# ============================================================
# Warp Ladger — Local Development Stack
# ============================================================

networks:
  warpladger:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [warpladger]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warpladger}
      POSTGRES_USER: ${POSTGRES_USER:-warpladger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warpladger_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warpladger} -d ${POSTGRES_DB:-warpladger}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [warpladger]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MinIO (S3-compatible local storage) ─────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    networks: [warpladger]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── MailHog (local email catcher) ───────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    networks: [warpladger]
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # ── Backend (FastAPI) ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    restart: unless-stopped
    networks: [warpladger]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-warpladger}:${POSTGRES_PASSWORD:-warpladger_dev}@postgres:5432/${POSTGRES_DB:-warpladger}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      EMAIL_BACKEND: console
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ── Frontend (Next.js) ──────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/docker/Dockerfile.web
    restart: unless-stopped
    networks: [warpladger]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev
