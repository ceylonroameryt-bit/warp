[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warpladger-backend"
version = "0.1.0"
description = "Warp Ladger — FastAPI Backend"
requires-python = ">=3.12"

dependencies = [
    # ── Web framework ────────────────────────────────────────
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # ── Database ─────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",

    # ── Validation ───────────────────────────────────────────
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # ── Security / Auth ──────────────────────────────────────
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",
    "itsdangerous>=2.2.0",

    # ── Redis ─────────────────────────────────────────────────
    "redis[asyncio]>=5.2.0",

    # ── File Storage ──────────────────────────────────────────
    "boto3>=1.35.0",
    "aioboto3>=13.2.0",

    # ── Email ─────────────────────────────────────────────────
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.0",

    # ── Logging ───────────────────────────────────────────────
    "structlog>=24.4.0",
    "python-json-logger>=2.0.0",

    # ── Utilities ─────────────────────────────────────────────
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "anyio>=4.6.0",
    "tenacity>=9.0.0",
    "pytz>=2024.2",
    "python-slugify>=8.0.0",
    "ulid-py>=1.1.0",

    # ── PDF Generation ────────────────────────────────────────
    "weasyprint>=62.0",

    # ── Background Jobs ───────────────────────────────────────────────────────
    "arq>=0.26.0",

    # ── Phase 5: Document Processing ─────────────────────────────────────────
    "google-cloud-documentai>=2.29.0",  # Google Document AI provider (production)
    "python-magic>=0.4.27",             # MIME type detection from raw file bytes
    "Pillow>=10.4.0",                   # Image preprocessing, rotation, quality checks
    "pypdf>=4.3.0",                     # PDF page count and metadata extraction
    "rapidfuzz>=3.9.0",                 # Fast fuzzy string matching for supplier names
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.0",
    "faker>=30.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
    "freezegun>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "S", "T20"]
ignore = ["S101", "B008"]  # allow assert in tests, allow Depends() calls

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
env_files = [".env.test"]

[tool.coverage.run]
source = ["app"]
omit = ["app/database/base.py", "tests/*"]
